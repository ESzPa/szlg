<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Csoportok{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #bbb; padding: .3rem .7rem; text-align: left; }
    th { background: #f0f0f0; }
    .szam { font-size: 3rem; font-weight: bold; }
    .ok { background: #e6f6e6; padding: .6rem 1rem; border-radius: 6px; }
    nav a { margin-right: .8rem; }
  </style>
</head>
<body>
  <nav><a href="{% url 'csoportok:index' %}">← Főoldal</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
