<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail</title>
    <script src="app_.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-base-200 min-h-screen py-8 px-4 font-sans text-base-content antialiased">

    <main class="max-w-2xl mx-auto space-y-6">
        
        <header class="text-center space-y-2 mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                Minimal Temp Mail
            </h1>
            <p class="text-sm text-base-content/60">Very good temporary mail yes yes it best is, yes.</p>
        </header>

        <section class="card bg-base-100 shadow-xl border border-base-300">
            <div class="card-body gap-4">
                <h2 class="card-title text-sm tracking-wide uppercase text-base-content/50">Your Temporary Email</h2>
                
                <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center bg-base-200 p-3 rounded-xl border border-base-300">
                    <span id="email-display" class="font-mono text-lg font-semibold px-2 break-all select-all flex-1 text-center sm:text-left">
                        Generating...
                    </span>
                    <button class="btn btn-primary btn-sm rounded-lg" onclick="navigator.clipboard.writeText(document.getElementById('email-display').innerText)">
                        Copy
                    </button>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-1">
                <div>
                    <h2 class="text-2xl font-bold tracking-tight">Inbox</h2>
                    <p id="status" class="text-xs text-base-content/60 mt-1">Status: Initializing account...</p>
                </div>
                
                <button id="refresh-btn" class="btn btn-primary shadow-sm" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-2 animate-spin-slow">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                    Refresh Now
                </button>
            </div>

            <ul id="messages-list" class="flex flex-col gap-4 items-center w-full">
            </ul>
        </section>

    </main>

</body>
</html>
